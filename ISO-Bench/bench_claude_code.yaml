# Production config — claude_code with sonnet for pass@k collection
container:
  engine: "docker"
  platform: "linux/amd64"
  cpus: "2"
  memory: "4g"
  network_policy: "off"
  gpus: "none"

paths:
  work_root: "./.work"
  state_root: "./state"
  reports_root: "./reports"

agents:
  default: "claude_code"
  claude_code:
    cli: "claude"
    args:
      model: "sonnet"
    time_budget_minutes: 120
