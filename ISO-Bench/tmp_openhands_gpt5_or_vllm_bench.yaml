container:
  engine: "${CONTAINER_ENGINE:-docker}"
  platform: "${CONTAINER_PLATFORM:-linux/amd64}"
  cpus: "${BENCH_CPUS:-2}"
  memory: "${BENCH_MEMORY:-4g}"
  network_policy: "off"
  gpus: "${BENCH_GPUS:-none}"

paths:
  work_root: "./.work"
  state_root: "./state"
  reports_root: "./reports"

agents:
  default: "openhands"
  openhands:
    cli: "/home/raven/coding-mess/kernel-corp/OmniPerf-Bench/bench-env-oh062/bin/python"
    time_budget_minutes: 120
    container_image: ""
    runtime_image: ""
    args:
      iterations: 120
      max_budget_per_task: 1000.0
      use_python_api: false

metrics:
  allowed:
    - "runtime:throughput"
    - "quality:hash_match"
