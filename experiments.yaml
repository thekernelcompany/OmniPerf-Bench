# OmniPerf-Bench commit-to-dataset configuration (BATCH MODE)
# This config processes ALL commits in the extractions directory
# Update the fields below as needed.

repo_path: "/root/OmniPerf-Bench/vllm"

# Where to find commit extraction JSONs used to generate tests
# Script will automatically process ALL JSON files in this directory
extractions_dir: "/root/OmniPerf-Bench/misc/experiments/commit_extractions_with_apis"

# Execution environment
use_docker: false
docker_image: "ayushnangia16/nvidia-vllm-docker:latest"

# Hugging Face output settings
dataset_name: vllm_dataset_with_test
hf_repo: https://huggingface.co/Inferencebench
push_to_hf: true

# Optional setup/install commands to record in the canonical record
setup_commands: []
install_commands: []

# Optional metadata
api: null
notes: null
