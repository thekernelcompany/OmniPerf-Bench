exp_id: "vllm"
repo_url: "https://github.com/vllm-project/vllm"
py_version: 3.9
target_commit: "main"

# vLLM-specific setup commands for cloud VMs
setup_commands:
    - "sudo apt-get update -y"
    - "sudo apt-get install -y python3-pip git build-essential"
    - "sudo apt-get install -y cuda-toolkit-11-8"  # For GPU support

# vLLM installation with dependencies
install_commands:
    - "uv venv --python 3.9"
    - "source .venv/bin/activate"
    - "uv pip install -e ."
    - "uv pip install torch==2.1.0 --index-url https://download.pytorch.org/whl/cu118"
    - "uv pip install transformers>=4.36.0"
    - "uv pip install ray>=2.9.0"
    - "uv pip install numpy"
    - "uv pip install triton>=2.1.0"
    - "uv pip install xformers==0.0.23"  # Optional: memory-efficient attention
    - "uv pip install flash-attn>=2.5.0"  # Optional: FlashAttention support
    - "uv pip install sentencepiece"  # For certain tokenizers
    - "uv pip install protobuf"
    - "uv pip install requests"

# API documentation for test generation
api_docs: |
    vLLM Core APIs and Optimization Targets:
    
    1. Inference APIs:
       - vllm.LLM: Main inference class with generate() and beam_search() methods
       - vllm.SamplingParams: Controls generation behavior (temperature, top_p, etc.)
       - vllm.RequestOutput: Structured output from generation
    
    2. Attention Layer:
       - vllm.attention.backends.PagedAttention: Core attention implementation
       - vllm.attention.ops: Low-level attention operations and kernels
       - Custom CUDA kernels in csrc/attention/
    
    3. Model Execution:
       - vllm.model_executor.ModelRunner: Executes model forward passes
       - vllm.model_executor.parallel_utils: Tensor and pipeline parallelism
       - vllm.worker.Worker: GPU worker process management
    
    4. Memory Management:
       - vllm.core.block_manager: Physical block allocation for KV cache
       - vllm.worker.cache_engine.CacheEngine: KV cache storage and operations
       - vllm.sequence.SequenceGroup: Request and sequence management
    
    5. Scheduling and Batching:
       - vllm.core.scheduler.Scheduler: Request scheduling and batching logic
       - vllm.engine.LLMEngine: High-level engine coordinating all components
       - vllm.engine.AsyncLLMEngine: Asynchronous serving interface
    
    6. Distributed Execution:
       - vllm.distributed: Communication primitives for multi-GPU
       - Ray-based distribution in vllm.engine.ray_utils

# Repository-specific instructions for test generation
repo_instr: |
    vLLM Performance Optimization Guidelines:
    
    1. Test Design Principles:
       - Use realistic model sizes (opt-125m, opt-350m for quick tests)
       - Test various batch sizes (1, 8, 16, 32) to cover different scenarios
       - Include both latency (single request) and throughput (batch) tests
       - Measure time-to-first-token and total generation time separately
       - Use diverse prompt lengths and generation lengths
    
    2. Key Optimization Areas:
       a) Attention Optimizations:
          - PagedAttention memory access patterns
          - FlashAttention integration benefits
          - Attention kernel fusion opportunities
          - Block size and page size tuning
       
       b) Memory Efficiency:
          - KV cache allocation and deallocation
          - Memory pool management
          - Cache sharing between sequences
          - Reducing memory fragmentation
       
       c) Batching Strategies:
          - Continuous batching implementation
          - Dynamic batch size adjustment
          - Request preemption and swapping
          - Priority-based scheduling
       
       d) Kernel Performance:
          - Custom CUDA kernel optimizations
          - Operator fusion (e.g., add + ReLU)
          - Optimized data layouts
          - Reduced memory bandwidth usage
       
       e) Parallelism:
          - Tensor parallel efficiency
          - Pipeline parallel optimization
          - Communication optimization
    
    3. Performance Test Patterns:
       - Warm-up runs before timing (load model, compile kernels)
       - Multiple iterations for stable measurements
       - Clear GPU cache between runs when testing memory optimizations
       - Test edge cases: empty batches, maximum sequence length, OOM handling
    
    4. Common Pitfalls to Avoid:
       - Don't test with models too large for available GPU memory
       - Ensure consistent sampling parameters for equivalence checking
       - Account for model loading time separately from inference time
       - Be aware of GPU memory fragmentation effects
    
    5. Workload Examples:
       - Chat completion: Multiple turns with growing context
       - Batch processing: Different request lengths in same batch
       - Streaming: Measure per-token latency
       - Long context: Test with 2K, 4K, 8K token contexts

# Cloud configuration hints (will be used by execute.py)
cloud: "gcp"  # or "aws", "azure"
region: "us-central1"  # GCP region with good GPU availability
instance_type: "n1-standard-8"  # Will add GPU via --gpus flag
# For AWS: instance_type: "g4dn.xlarge"
# For Azure: instance_type: "Standard_NC6s_v3"