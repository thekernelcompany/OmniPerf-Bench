model_providers:
  openrouter:
    provider: openrouter
    api_key: ${OPENROUTER_API_KEY}
    base_url: https://openrouter.ai/api/v1

models:
  kimi_model:
    model_provider: openrouter
    model: moonshotai/kimi-k2-thinking
    max_tokens: 32000
    temperature: 0.4
    top_p: 1
    top_k: 0
    max_retries: 6
    parallel_tool_calls: false

allow_mcp_servers: []
mcp_servers: {}

agents:
  trae_agent:
    enable_lakeview: false
    model: kimi_model
    max_steps: 120
    tools:
      - bash
      - str_replace_based_edit_tool
      - sequentialthinking
      - task_done
