# Global configuration for perf-agents-bench with Claude Code
# All values support environment variable substitution: ${VAR:-default}

container:
  engine: "${CONTAINER_ENGINE:-docker}"   # docker | podman
  platform: "${CONTAINER_PLATFORM:-linux/amd64}"  # set to linux/amd64 on Apple Silicon
  cpus: "${BENCH_CPUS:-2}"
  memory: "${BENCH_MEMORY:-4g}"
  network_policy: "off"                   # off | on_for_prepare | on
  gpus: "${BENCH_GPUS:-none}"             # none | all | "device=0"

paths:
  work_root: "./.work"
  state_root: "./state"
  reports_root: "./reports"

agents:
  default: "claude_code"
  claude_code:
    cli: "${CLAUDE_CODE_CLI:-claude}"     # Path to claude CLI
    args:
      max_steps: 50                        # --max-turns
      model: "${CLAUDE_CODE_MODEL:-}"      # Optional: claude-sonnet-4-20250514, opus, etc.
      allowed_tools: ""                    # Optional: comma-separated list of allowed tools
    time_budget_minutes: 60
  openhands:
    cli: "${OPENHANDS_CLI:-uvx}"
    time_budget_minutes: 60
    container_image: "${OPENHANDS_CONTAINER_IMAGE:-docker.all-hands.dev/all-hands-ai/openhands:0.54}"
    runtime_image: "${OPENHANDS_RUNTIME_IMAGE:-docker.all-hands.dev/all-hands-ai/runtime:0.54-nikolaik}"
    args:
      iterations: 1
      max_budget_per_task: 10.0
  trae:
    cli: "${TRAE_PYTHON:-python}"
    args:
      max_steps: 120
    time_budget_minutes: 120
    config_file: "${TRAE_CONFIG:-}"
  codex:
    cli: "${CODEX_PYTHON:-python}"
    args:
      max_steps: 120
    time_budget_minutes: 120
    config_file: "${CODEX_CONFIG:-}"
  codex_cli:
    cli: "${CODEX_CLI:-codex}"
    args:
      max_steps: 120
      profile: "${CODEX_PROFILE:-}"
    time_budget_minutes: 120

metrics:
  allowed:
    - "runtime:throughput"
    - "quality:hash_match"
