[project]
name = "perf-agents-bench"
version = "0.1.0"
description = "Engine-agnostic performance benchmarking system for AI agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "pydantic>=2",
    "pyyaml>=6",
    "jinja2>=3",
    "docker>=7.0.0",
]

[project.scripts]
bench = "bench.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench"]