# Configuration for Trae agent with Sonnet 4.5 (Bedrock)
# Network and web access are DISABLED for fair benchmarking

container:
  engine: "${CONTAINER_ENGINE:-docker}"
  platform: "${CONTAINER_PLATFORM:-linux/amd64}"
  cpus: "${BENCH_CPUS:-4}"
  memory: "${BENCH_MEMORY:-8g}"
  network_policy: "off"
  gpus: "${BENCH_GPUS:-none}"

paths:
  work_root: "./.work"
  state_root: "./state"
  reports_root: "./reports"

agents:
  default: "trae"
  trae:
    cli: "/home/ubuntu/OmniPerf-Bench/bench-env/bin/python"
    args:
      max_steps: 200
    time_budget_minutes: 120
    config_file: "/home/ubuntu/OmniPerf-Bench/third-party/trae-agent/trae_config_sonnet45_bedrock.yaml"

# Experiment settings
experiment:
  suppress_human_data: false
  hints_enabled: false

metrics:
  allowed:
    - "runtime:throughput"
    - "quality:hash_match"
